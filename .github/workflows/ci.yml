name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Тесты
        run: docker build --target test --progress=plain .
      - name: Сквозная проверка
        run: bash scripts/check-chain.sh
      - name: Состояние проекта при сбое
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs
