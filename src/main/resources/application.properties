spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/kkd}
spring.datasource.username=${DB_USER:kkd}
spring.datasource.password=${DB_PASSWORD:kkd_local_only}
spring.datasource.hikari.connection-timeout=3000
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false
logging.level.org.apache.coyote.http11.Http11Processor=WARN
logging.level.com.zaxxer.hikari.pool.ProxyConnection=ERROR
kkd.run-poll-ms=${KKD_RUN_POLL_MS:2000}
